name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    # Pinned rather than ubuntu-latest: the build depends on the image
    # providing g++-14.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libboost-dev libreadline-dev

      # The image's default g++ is 13, which is too old.
      - name: Build
        run: make -j"$(nproc)" CXX=g++-14

      - name: Run tests
        run: make test CXX=g++-14

  sanitize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libboost-dev libreadline-dev

      - name: Build
        run: make -j"$(nproc)" sanitize CXX=g++-14

      - name: Run tests under ASan, UBSan, and GC stress
        run: make test-sanitize CXX=g++-14
